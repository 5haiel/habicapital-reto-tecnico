server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: any unmatched path serves index.html so
        # React Router's client-side routes work on a hard refresh.
        try_files $uri $uri/ /index.html;
    }
}
